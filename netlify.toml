[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/download/windows"
  to = "https://github.com/PoweredByPixels/blocker-website/releases/download/playtest-2026-10-02-supply-and-settling/Blocker-Windows-x64-2026-10-02-c9e5f76.zip"
  status = 302
  force = true

# Platform-specific download URLs remain stable between release updates.
[[redirects]]
  from = "/download/macos"
  to = "https://github.com/PoweredByPixels/blocker-website/releases/download/playtest-2026-10-01-new-beginning/Blocker-macOS-Universal-2026-10-01-9c6daf4.zip"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self' https://jkvoldzojtbvifbilumm.supabase.co; base-uri 'self'; frame-ancestors 'none'; object-src 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[dev]
  command = "npm start"
  targetPort = 4196
  port = 8888
  framework = "#custom"
